name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Package extension
        run: |
          mkdir dist
          zip -r dist/ui-regression-detector.zip manifest.json background content dashboard popup utils icons
      - uses: actions/upload-artifact@v4
        with:
          name: ui-regression-detector
          path: dist/ui-regression-detector.zip
